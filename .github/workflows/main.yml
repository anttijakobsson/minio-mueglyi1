name: Check MinIO buckets

on:
  workflow_dispatch:

jobs:
  check-minio:
    runs-on: ubuntu-latest

    steps:
      - name: Download MinIO Client
        run: |
          curl -fsSL https://dl.min.io/aistor/mc/release/linux-amd64/mc -o mc
          chmod +x mc

      - name: Connect to MinIO
        env:
          MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
        run: |
          ./mc alias set render https://minio-server-oa80.onrender.com "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"

      - name: List MinIO buckets
        run: |
          echo "Buckets visible on minio-server-oa80:"
          ./mc ls render
